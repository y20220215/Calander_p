<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Calendar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; image-rendering: pixelated; }
        .calendar-container { background: #ffe6f7; border: 3px solid #ffb3e6; box-shadow: 0 0 0 1px #ffd9f2, 3px 3px 0 0 #ffb3e6, 6px 6px 0 0 #ffd9f2; padding: 12px; max-width: 220px; width: 100%; }
        @media (min-width: 480px) { .calendar-container { padding: 16px; max-width: 280px; } }
        @media (min-width: 768px) { .calendar-container { padding: 20px; max-width: 340px; } }
        @media (min-width: 1024px) { .calendar-container { padding: 24px; max-width: 420px; } }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px dashed #ffb3e6; gap: 8px; }
        .nav-buttons { display: flex; gap: 4px; align-items: center; }
        .month-year { color: #ff66cc; font-size: 12px; font-weight: bold; letter-spacing: 1px; flex: 1; }
        .nav-button { background: #fff0fa; border: 2px solid #ffb3e6; color: #ff66cc; width: 18px; height: 18px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 8px; font-weight: bold; transition: all 0.1s; box-shadow: 2px 2px 0 0 #ffcce6, 1px 1px 0 #ffb3e6; }
        .today-button { background: #fff0fa; border: 2px solid #ffb3e6; color: #ff66cc; padding: 2px 5px; cursor: pointer; font-size: 7px; font-weight: bold; transition: all 0.1s; box-shadow: 2px 2px 0 0 #ffcce6, 1px 1px 0 #ffb3e6; }
        .nav-button:hover, .today-button:hover { background: #ffe6f7; transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 #ffcce6, 2px 2px 0 #ffb3e6; }
        .nav-button:active, .today-button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 0 #ffcce6; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 6px; }
        .weekday { color: #ff66cc; font-size: 8px; font-weight: bold; text-align: center; padding: 4px 2px; background: #fff0fa; border: 2px solid #ffcce6; }
        .weekday-sat, .weekday-sun { background: #ffe6f7; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
        .day { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; background: #ffffff; border: 2px solid #ffcce6; color: #ff3399; font-size: 10px; font-weight: bold; cursor: pointer; transition: all 0.1s; position: relative; box-shadow: inset -1px -1px 0 rgba(255, 204, 230, 0.5), 1px 1px 0 #ffe6f7; }
        .day:hover { background: #fff0fa; border-color: #ffb3e6; transform: translate(-1px, -1px); box-shadow: inset -1px -1px 0 rgba(255, 204, 230, 0.5), 2px 2px 0 #ffb3e6; }
        .day:active { transform: translate(1px, 1px); box-shadow: inset 1px 1px 0 rgba(255, 204, 230, 0.3); }
        .day.today { background: linear-gradient(135deg, #ffb3e6 0%, #ff99dd 100%); color: #ffffff; border: 3px solid #ff66cc; box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.4), 2px 2px 0 #ffcce6; }
        .day.other-month { opacity: 0.3; cursor: default; background: #fafafa; }
        .day.saturday, .day.sunday { background: #fffafd; color: #ff66cc; }
        .day.saturday:hover, .day.sunday:hover { background: #fff0fa; }
        .day.has-event::after { content: '●'; position: absolute; bottom: 2px; font-size: 6px; color: #ff66cc; }
        .day.selected { background: #ffe6f7; color: #ff66cc; border-color: #ff66cc; box-shadow: 0 0 6px rgba(255, 102, 204, 0.4); }
        .event-tooltip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #ffb3e6; color: #ffffff; padding: 4px 8px; font-size: 8px; z-index: 1000; margin-bottom: 6px; border: 2px solid #ff66cc; box-shadow: 2px 2px 0 rgba(255, 102, 204, 0.3); pointer-events: none; opacity: 0; transition: opacity 0.2s; min-width: 50px; max-width: 140px; width: max-content; max-height: 100px; overflow-y: auto; }
        .event-tooltip.tooltip-bottom { bottom: auto; top: 100%; margin-bottom: 0; margin-top: 6px; }
        .day:hover .event-tooltip { opacity: 1; }
        .event-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid #ff66cc; }
        .event-tooltip.tooltip-bottom::after { top: auto; bottom: 100%; border-top: none; border-bottom: 4px solid #ff66cc; }
        .event-tooltip-item { margin: 3px 0; padding: 3px 0; border-bottom: 1px dotted rgba(255, 255, 255, 0.5); word-wrap: break-word; display: flex; align-items: center; }
        .event-tooltip-item:last-child { border-bottom: none; }
        .event-tooltip-priority { width: 5px; height: 5px; margin-right: 4px; border: 1px solid rgba(255, 255, 255, 0.3); flex-shrink: 0; }
        .event-tooltip-priority.priority-high { background: #a29bfe; }
        .event-tooltip-priority.priority-medium { background: #74b9ff; }
        .event-tooltip-priority.priority-low { background: #55efc4; }
        .event-tooltip-text { flex: 1; }
        .event-tooltip-more { text-align: center; font-size: 9px; color: rgba(255, 255, 255, 0.8); margin-top: 3px; font-weight: bold; }
        .event-input { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffe6f7; border: 3px solid #ffb3e6; box-shadow: 0 0 0 1px #ffd9f2, 3px 3px 0 0 #ffb3e6, 6px 6px 0 0 #ffd9f2, 0 0 30px rgba(255, 102, 204, 0.2); padding: 16px; width: 85%; max-width: 280px; z-index: 2000; display: none; }
        .event-input.active { display: block; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 179, 230, 0.15); backdrop-filter: blur(3px); z-index: 1999; display: none; }
        .modal-overlay.active { display: block; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px dashed #ffb3e6; }
        .modal-title { color: #ff66cc; font-size: 12px; font-weight: bold; }
        .close-button { background: #fff0fa; border: 2px solid #ffb3e6; color: #ff66cc; padding: 2px 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.1s; box-shadow: 2px 2px 0 0 #ffcce6, 1px 1px 0 #ffb3e6; }
        .close-button:hover { background: #ffe6f7; }
        .close-button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 0 #ffcce6; }
        .input-group { margin-bottom: 10px; }
        .input-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .input-time { width: 70px; padding: 6px; background: #ffffff; border: 2px solid #ffcce6; color: #ff66cc; font-family: 'Courier New', monospace; font-size: 10px; box-shadow: inset 1px 1px 2px rgba(255, 102, 204, 0.1); }
        .input-time:focus { outline: none; border-color: #ffb3e6; background: #fffafd; }
        .priority-selector { display: flex; gap: 4px; margin-bottom: 8px; }
        .priority-btn { flex: 1; padding: 5px; background: #fff0fa; border: 2px solid #ffcce6; font-family: 'Courier New', monospace; font-size: 9px; font-weight: bold; cursor: pointer; transition: all 0.1s; }
        .priority-btn:hover { background: #ffe6f7; }
        .priority-btn.active { box-shadow: inset 1px 1px 2px rgba(255, 102, 204, 0.2); }
        .priority-btn.priority-high { color: #a29bfe; }
        .priority-btn.priority-high.active { background: #f0eeff; border-color: #a29bfe; }
        .priority-btn.priority-medium { color: #74b9ff; }
        .priority-btn.priority-medium.active { background: #e8f4ff; border-color: #74b9ff; }
        .priority-btn.priority-low { color: #55efc4; }
        .priority-btn.priority-low.active { background: #e8fff9; border-color: #55efc4; }
        .input-label { color: #ff66cc; font-size: 10px; font-weight: bold; display: block; margin-bottom: 5px; }
        .event-text { width: 100%; padding: 7px; background: #ffffff; border: 2px solid #ffcce6; color: #ff66cc; font-family: 'Courier New', monospace; font-size: 11px; resize: none; box-shadow: inset 1px 1px 2px rgba(255, 102, 204, 0.1); }
        .event-text::placeholder { color: #ffcce6; }
        .event-text:focus { outline: none; border-color: #ffb3e6; background: #fffafd; }
        .button-group { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 8px; background: #fff0fa; border: 2px solid #ffb3e6; color: #ff66cc; font-family: 'Courier New', monospace; font-size: 10px; font-weight: bold; cursor: pointer; transition: all 0.1s; box-shadow: 2px 2px 0 0 #ffcce6, 1px 1px 0 #ffb3e6; }
        .btn:hover { background: #ffe6f7; transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 #ffcce6, 2px 2px 0 #ffb3e6; }
        .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 0 #ffcce6; }
        .btn-save { background: #ffb3e6; color: #ffffff; }
        .btn-save:hover { background: #ff99dd; }
        .events-list { margin-top: 12px; max-height: 120px; overflow-y: auto; }
        .event-limit-notice { text-align: center; font-size: 9px; color: #ffb3e6; margin-top: 8px; padding: 4px; background: #fff0fa; border: 1px solid #ffcce6; }
        .event-item { background: #ffffff; border: 2px solid #ffcce6; padding: 6px; margin-bottom: 5px; color: #ff66cc; font-size: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 1px 1px 0 #ffe6f7; }
        .event-content { flex: 1; }
        .event-priority { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border: 1px solid rgba(0, 0, 0, 0.1); vertical-align: middle; }
        .event-priority.priority-high { background: #a29bfe; }
        .event-priority.priority-medium { background: #74b9ff; }
        .event-priority.priority-low { background: #55efc4; }
        .event-time { font-size: 9px; color: #ffb3e6; font-weight: bold; }
        .event-text-display { font-size: 10px; color: #ff66cc; }
        .delete-event { background: #ffb3e6; border: 2px solid #ff99dd; color: #ffffff; padding: 2px 5px; cursor: pointer; font-size: 8px; font-weight: bold; transition: all 0.1s; box-shadow: 1px 1px 0 rgba(255, 102, 204, 0.3); }
        .delete-event:hover { background: #ff99dd; transform: scale(1.05); }
        .delete-event:active { transform: scale(0.95); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fff0fa; border: 1px solid #ffcce6; }
        ::-webkit-scrollbar-thumb { background: #ffb3e6; border: 1px solid #ff99dd; }
        ::-webkit-scrollbar-thumb:hover { background: #ff99dd; }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="month-year" id="monthYear"></div>
            <div class="nav-buttons">
                <button class="nav-button" id="prevMonth">◀</button>
                <button class="today-button" id="todayButton">TODAY</button>
                <button class="nav-button" id="nextMonth">▶</button>
            </div>
        </div>
        <div class="weekdays">
            <div class="weekday">MON</div>
            <div class="weekday">TUE</div>
            <div class="weekday">WED</div>
            <div class="weekday">THU</div>
            <div class="weekday">FRI</div>
            <div class="weekday weekday-sat">SAT</div>
            <div class="weekday weekday-sun">SUN</div>
        </div>
        <div class="days" id="calendar"></div>
    </div>
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="event-input" id="eventInput">
        <div class="modal-header">
            <div class="modal-title">EVENT FOR <span id="selectedDate"></span></div>
            <button class="close-button" id="closeModal">✕</button>
        </div>
        <div class="input-group">
            <label class="input-label">ADD NEW EVENT</label>
            <div class="input-row">
                <input type="time" class="input-time" id="eventTime" />
            </div>
            <div class="priority-selector">
                <button class="priority-btn priority-high" data-priority="high">HIGH</button>
                <button class="priority-btn priority-medium active" data-priority="medium">MID</button>
                <button class="priority-btn priority-low" data-priority="low">LOW</button>
            </div>
            <textarea class="event-text" id="eventText" rows="2" placeholder="Enter your event..."></textarea>
        </div>
        <div class="button-group">
            <button class="btn btn-save" id="saveEvent">SAVE</button>
            <button class="btn" id="cancelEvent">CANCEL</button>
        </div>
        <div class="event-limit-notice" id="eventLimitNotice" style="display: none;">Maximum 10 events per day</div>
        <div class="events-list" id="eventsList"></div>
    </div>

    </script>
</body>
</html>
